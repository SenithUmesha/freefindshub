# One-time operational cleanup. Remove this workflow immediately after it succeeds.
name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'SenithUmesha/freefindshub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "freefindshub-showcase-one-time-branch-cleanup",
          }

          request = urllib.request.Request(
              f"{api}/git/matching-refs/heads/", headers=headers
          )
          with urllib.request.urlopen(request) as response:
              refs = json.load(response)

          branches = sorted(
              item["ref"].removeprefix("refs/heads/") for item in refs
          )
          if "main" not in branches:
              raise SystemExit("Refusing cleanup because main was not found")

          targets = [branch for branch in branches if branch != "main"]
          for branch in targets:
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              delete = urllib.request.Request(
                  f"{api}/git/refs/{ref}", headers=headers, method="DELETE"
              )
              with urllib.request.urlopen(delete) as response:
                  if response.status != 204:
                      raise SystemExit(
                          f"Unexpected status deleting {branch}: {response.status}"
                      )
              print(f"Deleted branch: {branch}")

          print(f"Cleanup complete. Deleted {len(targets)} branch(es); kept main.")
